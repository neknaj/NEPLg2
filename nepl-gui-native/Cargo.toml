[package]
name = "nepl-gui-native"
version.workspace = true
edition.workspace = true

[features]
default = []
window = ["dep:minifb"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = { version = "0.28.0", optional = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "nepl-gui-native"
path = "src/main.rs"
