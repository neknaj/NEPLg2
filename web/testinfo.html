<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEPLg2 CI Test Info</title>
    <meta property="og:title" content="NEPLg2 CI Test Info">
    <meta property="og:description" content="GitHub Actions job status and published test artifact inventory for NEPLg2.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://neknaj.github.io/NEPLg2/testinfo.html">
    <link rel="canonical" href="https://neknaj.github.io/NEPLg2/testinfo.html">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0f14;
            --panel: #111827;
            --panel-2: #0f1724;
            --border: #253246;
            --text: #e5e7eb;
            --muted: #a7b0bf;
            --ok: #9ee7b7;
            --fail: #ffb4b4;
            --warn: #ffd38a;
            --info: #9bc7ff;
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
        }

        header {
            border-bottom: 1px solid var(--border);
            background: #0f1620;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .bar,
        main {
            max-width: 1160px;
            margin: 0 auto;
            padding: 16px;
        }

        .bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: 18px;
        }

        .sub,
        .hint {
            color: var(--muted);
            font-size: 13px;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        button,
        a.button {
            min-height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            padding: 8px 10px;
            text-decoration: none;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        button.primary {
            border-color: #3f6fa5;
            background: #17314c;
        }

        section {
            border: 1px solid var(--border);
            background: var(--panel);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 14px;
        }

        section h2 {
            margin: 0;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th,
        td {
            padding: 8px 10px;
            border-bottom: 1px solid #1f2937;
            text-align: left;
            white-space: nowrap;
        }

        th {
            color: var(--muted);
            background: #0d1420;
        }

        .mono {
            font-family: var(--mono);
        }

        .pill {
            display: inline-flex;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px 8px;
            font-size: 12px;
        }

        .ok {
            color: var(--ok);
        }

        .fail {
            color: var(--fail);
        }

        .warn {
            color: var(--warn);
        }

        .info {
            color: var(--info);
        }
    </style>
</head>

<body>
    <header>
        <div class="bar">
            <div>
                <h1>NEPLg2 CI Test Info</h1>
                <div class="sub">Current Pages artifact status from <span class="mono">./tests/status.json</span>.</div>
            </div>
            <div class="controls">
                <button id="reload" class="primary">Reload</button>
                <a class="button" href="./tests.html">Detailed Tests</a>
                <a class="button" href="./metrics.html">Metrics</a>
                <a class="button" href="./">Playground</a>
            </div>
        </div>
    </header>
    <main>
        <div id="status" class="hint">Loading CI status.</div>
        <section>
            <h2>Jobs</h2>
            <div style="overflow:auto;">
                <table id="jobs"></table>
            </div>
        </section>
        <section>
            <h2>Published Test JSON</h2>
            <div style="overflow:auto;">
                <table id="artifacts"></table>
            </div>
        </section>
    </main>

    <script>
        const REPORTS = [
            { label: "WASI doctests", job: "wasi_test", url: "./tests/tests-current.json" },
            { label: ".n.md doctests", job: "nmd_doctest", url: "./tests/nmd-tests.json" },
            { label: "Tutorial doctests", job: "tutorials_test", url: "./tests/tutorials-tests.json" },
            { label: "Example doctests", job: "examples_test", url: "./tests/examples-tests.json" },
            { label: "Stdlib doctests", job: "stdlib_test", url: "./tests/stdlib-tests.json" },
            { label: "LLVM doctests", job: "llvm_test", url: "./tests/tests-llvm.json" },
            { label: "Dual backend tests", job: "llvm_dual_test", url: "./tests/tests-dual-tests.json" },
            { label: "Dual backend stdlib", job: "llvm_dual_test", url: "./tests/tests-dual-stdlib.json" },
        ];
        const JOBS = [
            ["compile_test", "Rust compile tests"],
            ["rust_test", "Rust tests"],
            ["nm_compile", "NM compile"],
            ["wasi_test", "WASI doctests"],
            ["nmd_doctest", ".n.md doctests"],
            ["tutorials_test", "Tutorial doctests"],
            ["examples_test", "Example doctests"],
            ["stdlib_test", "Stdlib doctests"],
            ["llvm_test", "LLVM doctests"],
            ["llvm_dual_test", "LLVM dual backend"],
        ];

        const statusEl = document.getElementById("status");
        const jobsEl = document.getElementById("jobs");
        const artifactsEl = document.getElementById("artifacts");

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;");
        }

        function jobClass(value) {
            if (value === "success") return "ok";
            if (value === "failure" || value === "cancelled" || value === "timed_out") return "fail";
            if (value === "skipped" || value === "pending") return "warn";
            return "info";
        }

        async function fetchJson(url) {
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
            return await res.json();
        }

        async function probe(url) {
            try {
                const payload = await fetchJson(url);
                return { ok: true, payload };
            } catch (error) {
                return { ok: false, error: String(error && error.message ? error.message : error) };
            }
        }

        function summaryText(payload) {
            const summary = payload?.summary;
            if (!summary) return "";
            return `total ${summary.total || 0}, pass ${summary.passed || 0}, fail ${summary.failed || 0}, error ${summary.errored || 0}, timeout ${summary.timed_out || 0}`;
        }

        function renderStatus(status) {
            const run = status.run_url ? ` <a class="button" href="${escapeHtml(status.run_url)}">Actions Run</a>` : "";
            const sha = status.head_sha ? ` sha <span class="mono">${escapeHtml(String(status.head_sha).slice(0, 12))}</span>` : "";
            statusEl.innerHTML = `state <span class="pill ${jobClass(status.state)} mono">${escapeHtml(status.state || "unknown")}</span>${sha}${run} <span class="hint">${escapeHtml(status.message || "")}</span>`;
        }

        function renderJobs(status) {
            jobsEl.innerHTML = `<thead><tr><th>job</th><th>result</th></tr></thead><tbody>
                ${JOBS.map(([key, label]) => {
                    const value = status[key] || (status.state === "pending" ? "pending" : "unknown");
                    return `<tr><td>${escapeHtml(label)}</td><td><span class="pill ${jobClass(value)} mono">${escapeHtml(value)}</span></td></tr>`;
                }).join("")}
            </tbody>`;
        }

        async function renderArtifacts() {
            const rows = [];
            for (const report of REPORTS) {
                const result = await probe(report.url);
                rows.push(`<tr>
                    <td>${escapeHtml(report.label)}</td>
                    <td class="mono"><a href="${escapeHtml(report.url)}">${escapeHtml(report.url)}</a></td>
                    <td><span class="pill ${result.ok ? "ok" : "warn"} mono">${result.ok ? "available" : "missing"}</span></td>
                    <td class="mono">${escapeHtml(result.ok ? summaryText(result.payload) : result.error)}</td>
                </tr>`);
            }
            artifactsEl.innerHTML = `<thead><tr><th>report</th><th>path</th><th>state</th><th>summary</th></tr></thead><tbody>${rows.join("")}</tbody>`;
        }

        async function load() {
            let status;
            try {
                status = await fetchJson("./tests/status.json");
            } catch (error) {
                status = { state: "missing", message: String(error && error.message ? error.message : error) };
            }
            renderStatus(status);
            renderJobs(status);
            await renderArtifacts();
        }

        document.getElementById("reload").addEventListener("click", load);
        load();
    </script>
</body>

</html>
