<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEPLg2 CI Test Results</title>
    <meta property="og:title" content="NEPLg2 CI Test Results">
    <meta property="og:description" content="Current GitHub Actions doctest JSON results for NEPLg2.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://neknaj.github.io/NEPLg2/tests.html">
    <link rel="canonical" href="https://neknaj.github.io/NEPLg2/tests.html">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0f14;
            --panel: #111827;
            --panel-2: #0f1724;
            --border: #253246;
            --text: #e5e7eb;
            --muted: #a7b0bf;
            --faint: #728095;
            --ok: #9ee7b7;
            --fail: #ffb4b4;
            --warn: #ffd38a;
            --info: #9bc7ff;
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
        }

        header {
            border-bottom: 1px solid var(--border);
            background: #0f1620;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .bar,
        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px;
        }

        .bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: 18px;
        }

        .sub,
        .hint {
            color: var(--muted);
            font-size: 13px;
        }

        .sub {
            margin-top: 4px;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        input,
        select,
        button,
        a.button {
            min-height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            padding: 8px 10px;
            text-decoration: none;
            font: inherit;
            font-size: 13px;
        }

        input {
            width: min(360px, 80vw);
        }

        button,
        a.button {
            cursor: pointer;
        }

        button.primary {
            border-color: #3f6fa5;
            background: #17314c;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 10px;
            margin: 14px 0;
        }

        @media (max-width: 920px) {
            .summary {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 560px) {
            .summary {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        .stat,
        section {
            border: 1px solid var(--border);
            background: var(--panel);
            border-radius: 8px;
        }

        .stat {
            padding: 12px;
        }

        .stat .k {
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .stat .v {
            font-size: 24px;
            font-weight: 800;
            margin-top: 6px;
        }

        section {
            margin-top: 14px;
            overflow: hidden;
        }

        section h2 {
            margin: 0;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th,
        td {
            padding: 8px 10px;
            border-bottom: 1px solid #1f2937;
            text-align: right;
            white-space: nowrap;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }

        th {
            color: var(--muted);
            background: #0d1420;
        }

        tr:hover td {
            background: #132032;
        }

        details {
            border-top: 1px solid #1f2937;
        }

        summary {
            cursor: pointer;
            padding: 10px 14px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }

        pre {
            margin: 0;
            padding: 10px 14px 14px;
            overflow: auto;
            color: var(--muted);
            background: #0d1420;
            border-top: 1px solid #1f2937;
        }

        .mono {
            font-family: var(--mono);
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px 8px;
            font-size: 12px;
        }

        .ok {
            color: var(--ok);
        }

        .fail,
        .error {
            color: var(--fail);
        }

        .warn {
            color: var(--warn);
        }

        .info {
            color: var(--info);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }
    </style>
</head>

<body>
    <header>
        <div class="bar">
            <div>
                <h1>NEPLg2 CI Test Results</h1>
                <div class="sub">Loads current GitHub Actions JSON artifacts from <span class="mono">./tests/</span>.</div>
            </div>
            <div class="controls">
                <button id="reload" class="primary">Reload</button>
                <a class="button" href="./testinfo.html">Info</a>
                <a class="button" href="./metrics.html">Metrics</a>
                <a class="button" href="./">Playground</a>
            </div>
        </div>
    </header>
    <main>
        <div id="status" class="hint">Loading CI status.</div>
        <div id="summary" class="summary"></div>
        <section>
            <div class="toolbar">
                <div class="controls">
                    <input id="filter" placeholder="Filter file, id, phase, message" />
                    <select id="dataset"></select>
                    <label class="pill"><input id="show-pass" type="checkbox"> show pass</label>
                </div>
                <div id="loaded" class="hint"></div>
            </div>
            <div id="reports"></div>
            <div id="results"></div>
        </section>
    </main>

    <script>
        const REPORTS = [
            { id: "wasi", label: "WASI doctests", job: "wasi_test", url: "./tests/tests-current.json" },
            { id: "nmd", label: ".n.md doctests", job: "nmd_doctest", url: "./tests/nmd-tests.json" },
            { id: "tutorials", label: "Tutorial doctests", job: "tutorials_test", url: "./tests/tutorials-tests.json" },
            { id: "examples", label: "Example doctests", job: "examples_test", url: "./tests/examples-tests.json" },
            { id: "stdlib", label: "Stdlib doctests", job: "stdlib_test", url: "./tests/stdlib-tests.json" },
            { id: "llvm", label: "LLVM doctests", job: "llvm_test", url: "./tests/tests-llvm.json" },
            { id: "dual-tests", label: "Dual backend tests", job: "llvm_dual_test", url: "./tests/tests-dual-tests.json" },
            { id: "dual-stdlib", label: "Dual backend stdlib", job: "llvm_dual_test", url: "./tests/tests-dual-stdlib.json" },
        ];

        const fmt = new Intl.NumberFormat("en-US");
        const state = { status: null, reports: [], filter: "", dataset: "all", showPass: false };
        const els = {
            status: document.getElementById("status"),
            summary: document.getElementById("summary"),
            reports: document.getElementById("reports"),
            results: document.getElementById("results"),
            loaded: document.getElementById("loaded"),
            filter: document.getElementById("filter"),
            dataset: document.getElementById("dataset"),
            showPass: document.getElementById("show-pass"),
        };

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;");
        }

        function resultStatus(result) {
            const status = String(result?.status || "");
            if (status === "pass" || status === "passed" || status === "ok") return "pass";
            if (status === "fail" || status === "failed") return "fail";
            return "error";
        }

        function summarizeResults(results) {
            const summary = { total: 0, passed: 0, failed: 0, errored: 0, timed_out: 0, timeout_failed: 0, timeout_errored: 0, non_timeout_failed: 0, non_timeout_errored: 0 };
            for (const result of results) {
                const status = resultStatus(result);
                const timeout = result && typeof result.timeout === "object" && result.timeout !== null;
                summary.total += 1;
                if (timeout) summary.timed_out += 1;
                if (status === "pass") summary.passed += 1;
                else if (status === "fail") {
                    summary.failed += 1;
                    if (timeout) summary.timeout_failed += 1;
                    else summary.non_timeout_failed += 1;
                } else {
                    summary.errored += 1;
                    if (timeout) summary.timeout_errored += 1;
                    else summary.non_timeout_errored += 1;
                }
            }
            return summary;
        }

        function reportSummary(report) {
            return report.payload?.summary || summarizeResults(report.results);
        }

        function addSummaries(items) {
            const total = { total: 0, passed: 0, failed: 0, errored: 0, timed_out: 0, timeout_failed: 0, timeout_errored: 0, non_timeout_failed: 0, non_timeout_errored: 0 };
            for (const item of items) {
                const s = reportSummary(item);
                for (const key of Object.keys(total)) total[key] += Number(s[key] || 0);
            }
            return total;
        }

        function stat(label, value, cls = "") {
            return `<div class="stat"><div class="k">${escapeHtml(label)}</div><div class="v mono ${cls}">${fmt.format(value || 0)}</div></div>`;
        }

        function jobClass(value) {
            if (value === "success") return "ok";
            if (value === "failure" || value === "cancelled" || value === "timed_out") return "fail";
            if (value === "skipped" || value === "pending") return "warn";
            return "info";
        }

        async function fetchJson(url) {
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
            return await res.json();
        }

        async function loadAll() {
            els.status.textContent = "Loading CI status.";
            state.status = null;
            state.reports = [];
            try {
                state.status = await fetchJson("./tests/status.json");
            } catch (error) {
                state.status = { state: "missing", message: String(error && error.message ? error.message : error) };
            }

            const loaded = [];
            for (const def of REPORTS) {
                try {
                    const payload = await fetchJson(def.url);
                    loaded.push({
                        ...def,
                        payload,
                        missing: false,
                        results: Array.isArray(payload?.results) ? payload.results : [],
                    });
                } catch (error) {
                    loaded.push({ ...def, payload: null, missing: true, error: String(error && error.message ? error.message : error), results: [] });
                }
            }
            state.reports = loaded;
            populateDatasets();
            render();
        }

        function populateDatasets() {
            const options = ['<option value="all">all reports</option>'];
            for (const report of state.reports) {
                options.push(`<option value="${escapeHtml(report.id)}">${escapeHtml(report.label)}</option>`);
            }
            els.dataset.innerHTML = options.join("");
            els.dataset.value = state.dataset;
        }

        function filteredResults() {
            const selected = state.dataset === "all"
                ? state.reports
                : state.reports.filter((report) => report.id === state.dataset);
            const q = state.filter.trim().toLowerCase();
            const rows = [];
            for (const report of selected) {
                for (const result of report.results) {
                    const status = resultStatus(result);
                    if (!state.showPass && status === "pass") continue;
                    const hay = [
                        report.label,
                        result.id,
                        result.file,
                        result.path,
                        result.phase,
                        result.error,
                        result.reason,
                        result.message,
                    ].join(" ").toLowerCase();
                    if (!q || hay.includes(q)) rows.push({ report, result, status });
                }
            }
            return rows;
        }

        function renderStatusLine() {
            const status = state.status || {};
            const runLink = status.run_url ? ` <a class="button" href="${escapeHtml(status.run_url)}">Actions Run</a>` : "";
            const sha = status.head_sha ? ` sha <span class="mono">${escapeHtml(String(status.head_sha).slice(0, 12))}</span>` : "";
            els.status.innerHTML = `state <span class="pill ${jobClass(status.state)} mono">${escapeHtml(status.state || "unknown")}</span>${sha}${runLink} <span class="hint">${escapeHtml(status.message || "")}</span>`;
        }

        function renderSummary() {
            const totals = addSummaries(state.reports.filter((report) => !report.missing));
            els.summary.innerHTML = [
                stat("Total", totals.total),
                stat("Passed", totals.passed, "ok"),
                stat("Failed", totals.failed, totals.failed ? "fail" : ""),
                stat("Errored", totals.errored, totals.errored ? "fail" : ""),
                stat("Timed Out", totals.timed_out, totals.timed_out ? "warn" : ""),
                stat("Reports", state.reports.filter((report) => !report.missing).length),
            ].join("");
        }

        function renderReports() {
            els.reports.innerHTML = `<div style="overflow:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>report</th>
                            <th>job</th>
                            <th>total</th>
                            <th>passed</th>
                            <th>failed</th>
                            <th>errored</th>
                            <th>timeout</th>
                            <th>artifact</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${state.reports.map((report) => {
                            const s = reportSummary(report);
                            const job = state.status?.[report.job] || (state.status?.state === "pending" ? "pending" : "unknown");
                            return `<tr>
                                <td>${escapeHtml(report.label)}</td>
                                <td><span class="pill ${jobClass(job)} mono">${escapeHtml(job)}</span></td>
                                <td>${fmt.format(s.total || 0)}</td>
                                <td class="ok">${fmt.format(s.passed || 0)}</td>
                                <td class="${s.failed ? "fail" : ""}">${fmt.format(s.failed || 0)}</td>
                                <td class="${s.errored ? "fail" : ""}">${fmt.format(s.errored || 0)}</td>
                                <td class="${s.timed_out ? "warn" : ""}">${fmt.format(s.timed_out || 0)}</td>
                                <td class="mono">${report.missing ? `<span class="warn">missing</span>` : `<a href="${escapeHtml(report.url)}">${escapeHtml(report.url)}</a>`}</td>
                            </tr>`;
                        }).join("")}
                    </tbody>
                </table>
            </div>`;
        }

        function renderResults() {
            const rows = filteredResults();
            els.loaded.textContent = `${fmt.format(rows.length)} result row(s)`;
            if (rows.length === 0) {
                els.results.innerHTML = `<div class="hint" style="padding:14px;">No matching result rows. Enable pass rows or wait for final CI artifacts if the site is pending.</div>`;
                return;
            }
            els.results.innerHTML = rows.slice(0, 600).map(({ report, result, status }) => {
                const timeout = result && typeof result.timeout === "object" && result.timeout !== null;
                const title = `${report.label} / ${result.id || result.file || "(unknown)"}`;
                const message = result.error || result.reason || result.message || "";
                return `<details ${status === "pass" ? "" : "open"}>
                    <summary>
                        <span>
                            <span class="pill ${status === "pass" ? "ok" : "fail"} mono">${escapeHtml(status)}</span>
                            ${timeout ? `<span class="pill warn mono">timeout</span>` : ""}
                            <span class="mono">${escapeHtml(title)}</span>
                        </span>
                        <span class="hint">${escapeHtml(result.phase || "")}</span>
                    </summary>
                    <pre>${escapeHtml(message || JSON.stringify(result, null, 2))}</pre>
                </details>`;
            }).join("") + (rows.length > 600 ? `<div class="hint" style="padding:14px;">Showing first 600 rows. Narrow the filter to inspect more.</div>` : "");
        }

        function render() {
            renderStatusLine();
            renderSummary();
            renderReports();
            renderResults();
        }

        document.getElementById("reload").addEventListener("click", loadAll);
        els.filter.addEventListener("input", (event) => {
            state.filter = event.target.value;
            renderResults();
        });
        els.dataset.addEventListener("change", (event) => {
            state.dataset = event.target.value;
            renderResults();
        });
        els.showPass.addEventListener("change", (event) => {
            state.showPass = event.target.checked;
            renderResults();
        });

        loadAll();
    </script>
</body>

</html>
