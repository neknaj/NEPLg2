<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link data-trunk rel="copy-file" href="coi-serviceworker.js" />
    <script src="coi-serviceworker.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEPLg2 Playground</title>
    <meta property="og:title" content="NEPLg2 Playground">
    <meta property="og:description" content="Experimental programming language NEPLg2 interactive playground.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://neknaj.github.io/NEPLg2/">
    <meta property="og:site_name" content="NEPLg2">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:image" content="https://neknaj.github.io/NEPLg2/NEPLg2.png">
    <link rel="canonical" href="https://neknaj.github.io/NEPLg2/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@bem130">
    <meta name="twitter:creator" content="@bem130">
    <meta name="twitter:image" content="https://neknaj.github.io/NEPLg2/NEPLg2.png">
    <link data-trunk rel="css" href="styles.css">
    <link data-trunk rel="copy-dir" href="vendor">
    <link data-trunk rel="copy-dir" href="src">
    <link data-trunk rel="copy-dir" href="examples">
    <link data-trunk rel="rust" href="../nepl-web/Cargo.toml" data-bindgen-target="web" data-cargo-profile="release">
    <link data-trunk rel="copy-file" href="testinfo.html" />
    <link data-trunk rel="copy-file" href="tests.html" />
    <link data-trunk rel="copy-file" href="metrics.html" />
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="logo-text">NEPLg2</span>
                <span class="badge">Playground</span>
            </div>
            <div class="controls">
                <a href="./tests.html" target="_blank" class="header-link" title="Compiler Tests">Tests</a>
                <a href="./metrics.html" target="_blank" class="header-link" title="Repository Metrics">Metrics</a>
                <a href="./tutorials/getting_started/00_index.html" target="_blank" class="header-link" title="Getting Started Tutorial">Tutorial</a>
                <a href="./doc/stdlib/index.html" target="_blank" class="header-link" title="Standard Library Documentation">Stdlib</a>
                <div class="control-group">
                    <label for="font-size-select">Size:</label>
                    <select id="font-size-select">
                        <option value="12">12px</option>
                        <option value="14" selected>14px</option>
                        <option value="16">16px</option>
                        <option value="18">18px</option>
                        <option value="20">20px</option>
                        <option value="24">24px</option>
                    </select>
                </div>
                <div class="control-group">
                    <button id="run-button" class="btn" title="Run the program">Run</button>
                    <button id="compile-button" class="btn" title="Compile to WAT">Compile</button>
                    <button id="help-button" class="btn" title="Show help">Help</button>
                    <button id="editor-help-button" class="btn" title="Editor feature help">Editor</button>
                    <button id="reset-layout-button" class="btn" title="Reset workspace layout">Layout</button>
                    <button id="clear-button" class="btn" title="Clear terminal">Clear</button>
                    <button id="stop-button" class="btn btn-danger" title="Stop execution">Stop</button>
                </div>
            </div>
        </header>

        <main class="workspace-shell">
            <div class="workspace" id="workspace-root"></div>
            <div class="gui-window-layer" id="gui-window-layer" aria-live="polite"></div>
        </main>

        <div id="general-popup" class="popup-tooltip hidden"></div>

        <footer id="status-bar" class="status-bar">
            <div class="status-left">
                <span id="cursor-pos">Ln 1, Col 1</span>
            </div>
            <div class="status-right">
                <span id="terminal-status">wasi-target</span>
                <span id="editor-lang">NEPLg2</span>
                <span id="editor-encoding">UTF-8</span>
                <span id="editor-indent">Spaces: 4</span>
            </div>
        </footer>
    </div>

    <link data-trunk rel="copy-dir" href="dist_ts">
    <script src="./dist_ts/editor/editor-utils.js"></script>
    <script src="./dist_ts/editor/editor-dom-ui.js"></script>
    <script src="./dist_ts/editor/editor-renderer.js"></script>
    <script src="./dist_ts/editor/editor-input-handler.js"></script>
    <script src="./dist_ts/editor/editor.js"></script>
    <script src="./dist_ts/language/language-provider.js"></script>
    <script src="./dist_ts/language/javascript/js-provider.js"></script>
    <script src="./dist_ts/language/markdown/md-provider.js"></script>
    <script src="./dist_ts/language/neplg2/neplg2-provider.js"></script>
    <script src="./dist_ts/library/canvas-editor-lib.js"></script>
    <script type="module" src="dist_ts/main.js"></script>
</body>

</html>
