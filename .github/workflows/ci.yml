name: CI (NEPL-g2)

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    NO_COLOR: "true"
    NEPL_TEST_CASE_TIMEOUT_MS: "20000"
    NEPL_WASIX_TIMEOUT_MS: "20000"

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Shared bootstrap build
              uses: ./.github/actions/bootstrap-build

            - name: Verify playground HTML in Pages dist
              run: |
                  mkdir -p dist
                  if [ -d web/dist ]; then
                    cp -a web/dist/. dist/
                  fi
                  test -f dist/index.html
                  test -f dist/tests.html
                  test -f dist/testinfo.html
                  test -f dist/metrics.html

            - name: Source policy regressions
              run: node nodesrc/run_source_policy_regressions.js --warn-only

            - name: Build tutorials HTML into dist
              run: |
                  rm -rf dist/tutorials
                  node nodesrc/cli.js -i tutorials/getting_started -o html_play=dist/tutorials/getting_started --site-name "NEPLg2 Tutorial" --description-prefix "NEPLg2 Getting Started tutorial"

            - name: Build doc + stdlib HTML into dist
              run: |
                  rm -rf dist/doc
                  mkdir -p /tmp/nepl-doc-root
                  cp -r doc/. /tmp/nepl-doc-root/
                  cp -r stdlib /tmp/nepl-doc-root/stdlib
                  node nodesrc/cli.js -i /tmp/nepl-doc-root -o html_play=dist/doc --exclude-dir chat --exclude-dir tests --exclude-dir tests_backup --site-name "NEPLg2 ドキュメント" --description-prefix "NEPLg2"

            - name: Build repository metrics into dist
              run: |
                  mkdir -p dist/metrics
                  node nodesrc/run_repo_metrics.js --root . --json dist/metrics/repo_metrics.json --csv dist/metrics/repo_metrics.csv
                  node nodesrc/run_repo_metrics_history.js --root . --limit 24 --json dist/metrics/repo_metrics_history.json

            - name: Upload bootstrap build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: bootstrap-build
                  path: |
                      dist
                      target/debug
                      target/wasm32-unknown-unknown
                      nodesrc/parser.js
                      nodesrc/html_gen.js
                  compression-level: 1

    compile-test:
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Restore Cargo cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: nepl-g2
                  cache-on-failure: true

            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Install Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                  profile: minimal
                  toolchain: stable
                  override: true

            - name: Install wasm32 target
              run: rustup target add wasm32-unknown-unknown

            - name: Rust compile tests (no run)
              run: node nodesrc/ci_timeout.js --minutes 10 --label "Rust compile tests" -- cargo test --no-run --all --all-features --locked

            - name: Rust compile tests wasm32 (no run)
              run: node nodesrc/ci_timeout.js --minutes 10 --label "Rust compile tests wasm32" -- cargo test --target wasm32-unknown-unknown --no-run --all --all-features --locked

    rust-test:
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Restore Cargo cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: nepl-g2
                  cache-on-failure: true

            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Install Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                  profile: minimal
                  toolchain: stable
                  override: true

            - name: Rust tests
              run: node nodesrc/ci_timeout.js --minutes 10 --label "Rust tests" -- cargo test --all --all-features --no-fail-fast

    nm-compile:
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Restore Cargo cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: nepl-g2
                  cache-on-failure: true

            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Install Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                  profile: minimal
                  toolchain: stable
                  override: true

            - name: NM compile tests
              run: node nodesrc/ci_timeout.js --minutes 10 --label "NM compile tests" -- cargo run -p nepl-cli -- --target wasi --profile debug --input examples/nm.nepl --output target/ci-nm

    wasi-test:
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Restore Cargo cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: nepl-g2
                  cache-on-failure: true

            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Install Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                  profile: minimal
                  toolchain: stable
                  override: true

            - name: NEPL-g2 doctests
              run: node nodesrc/ci_timeout.js --minutes 10 --label "NEPL-g2 doctests" --timeout-nonfatal -- node nodesrc/tests.js -i tests -o tests-current.json -j 4 --timeout-nonfatal

            - name: CLI multi-emit output
              run: |
                  node nodesrc/ci_timeout.js --minutes 10 --label "CLI multi-emit output" -- cargo run -p nepl-cli -- -i examples/counter.nepl -o target/ci-counter --emit wasm,wat,wat-min
                  test -f target/ci-counter.wasm
                  test -f target/ci-counter.wat
                  test -f target/ci-counter.min.wat

            - name: Upload wasi doctest JSON
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: wasi-tests
                  path: tests-current.json
                  if-no-files-found: ignore

    nmd-doctest:
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Run .n.md doctests (tests/ only)
              run: node nodesrc/ci_timeout.js --minutes 10 --label ".n.md doctests" --timeout-nonfatal -- node nodesrc/tests.js -i tests -o nmd-tests.json -j 4 --timeout-nonfatal

            - name: Upload doctest JSON
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: nmd-tests
                  path: nmd-tests.json
                  if-no-files-found: ignore

    tutorials-test:
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Run tutorials doctests
              run: node nodesrc/ci_timeout.js --minutes 10 --label "tutorials doctests" --timeout-nonfatal -- node nodesrc/tests.js -i tutorials -o tutorials-tests.json -j 4 --timeout-nonfatal

            - name: Upload tutorials test JSON
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: tutorials-tests
                  path: tutorials-tests.json
                  if-no-files-found: ignore

    examples-test:
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Run examples doctests
              env:
                  NEPL_TEST_CASE_TIMEOUT_MS: "60000"
              run: node nodesrc/ci_timeout.js --minutes 10 --label "examples doctests" --timeout-nonfatal -- node nodesrc/tests.js -i examples -o examples-tests.json -j 2 --timeout-nonfatal

            - name: Upload examples test JSON
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: examples-tests
                  path: examples-tests.json
                  if-no-files-found: ignore

    stdlib-test:
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Run stdlib doctests
              run: node nodesrc/ci_timeout.js --minutes 10 --label "stdlib doctests" --timeout-nonfatal -- node nodesrc/tests.js -i stdlib -o stdlib-tests.json -j 4 --timeout-nonfatal

            - name: Upload stdlib test JSON
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: stdlib-tests
                  path: stdlib-tests.json
                  if-no-files-found: ignore

    llvm-test:
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 15

        env:
            LLVM_VERSION: "21.1.0"
            LLVM_DIR: "${{ github.workspace }}/.cache/llvm/21.1.0"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Restore Cargo cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: nepl-g2
                  cache-on-failure: true

            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Install Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                  profile: minimal
                  toolchain: stable
                  override: true

            - name: Cache LLVM toolchain
              id: cache-llvm
              uses: actions/cache@v4
              with:
                  path: ${{ env.LLVM_DIR }}
                  key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ env.LLVM_VERSION }}

            - name: Install clang 21.1.0 (linux native)
              if: steps.cache-llvm.outputs.cache-hit != 'true'
              run: |
                  curl -L -o /tmp/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz \
                    https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz
                  mkdir -p "${LLVM_DIR}"
                  tar -C "${LLVM_DIR}" --strip-components=1 -xf /tmp/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz

            - name: Export LLVM environment
              run: |
                  echo "${LLVM_DIR}/bin" >> "${GITHUB_PATH}"
                  echo "NEPL_LLVM_STRICT=1" >> "${GITHUB_ENV}"
                  echo "NEPL_LLVM_CLANG_VERSION=${LLVM_VERSION}" >> "${GITHUB_ENV}"
                  echo "NEPL_LLVM_CLANG_BIN=${LLVM_DIR}/bin/clang" >> "${GITHUB_ENV}"
                  echo "NEPL_LLVM_TRIPLE_CONTAINS=linux" >> "${GITHUB_ENV}"

            - name: Verify LLVM toolchain
              run: |
                  clang --version
                  llvm-as --version
                  llc --version
                  clang -dumpmachine | grep -q linux

            - name: LLVM doctests via nodesrc runner
              run: node nodesrc/ci_timeout.js --minutes 10 --label "LLVM doctests" --timeout-nonfatal -- node nodesrc/tests.js -i tests/compiler/llvm_target.n.md -o tests-llvm.json --runner llvm --llvm-compile-only --no-tree --no-stdlib -j 2 --timeout-nonfatal

            - name: Upload llvm doctest JSON
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: llvm-tests
                  path: tests-llvm.json
                  if-no-files-found: ignore

    selfhost-doctest:
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 25

        strategy:
            fail-fast: false
            matrix:
                include:
                    - id: wasi
                      label: WASI doctests
                      inputs: "-i tests"
                      output: selfhost-wasi-tests.json
                    - id: nmd
                      label: .n.md doctests
                      inputs: "-i tests"
                      output: selfhost-nmd-tests.json
                    - id: tutorials
                      label: Tutorial doctests
                      inputs: "-i tutorials"
                      output: selfhost-tutorials-tests.json
                    - id: examples
                      label: Example doctests
                      inputs: "-i examples"
                      output: selfhost-examples-tests.json
                    - id: stdlib
                      label: Stdlib doctests
                      inputs: "-i stdlib"
                      output: selfhost-stdlib-tests.json
                    - id: llvm
                      label: LLVM doctests
                      inputs: "-i tests/compiler/llvm_target.n.md"
                      output: selfhost-llvm-tests.json

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Run selfhost compiler check doctests (${{ matrix.label }})
              run: |
                  timeout_marker="${{ matrix.output }}.timeout.json"
                  node nodesrc/ci_timeout.js --minutes 18 --label "Selfhost compiler check doctests (${{ matrix.id }})" --timeout-marker "${timeout_marker}" --timeout-nonfatal -- node nodesrc/run_selfhost_doctest_check.js ${{ matrix.inputs }} -o ${{ matrix.output }} -j 1 --batch-size 80 --failure-nonfatal
                  node nodesrc/complete_selfhost_doctest_artifact.js --marker "${timeout_marker}" --json "${{ matrix.output }}" --suite-id "${{ matrix.id }}" --suite-label "${{ matrix.label }}" --matrix-inputs "${{ matrix.inputs }}"

            - name: Upload selfhost compiler check JSON (${{ matrix.id }})
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: selfhost-${{ matrix.id }}-tests
                  path: ${{ matrix.output }}
                  if-no-files-found: ignore

    llvm-dual-test:
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 25

        strategy:
            fail-fast: false
            matrix:
                include:
                    - id: tests-shard-1
                      inputs: "-i tests"
                      shard: "1/8"
                      tree_flag: "--with-tree"
                      output: tests-dual-tests-shard-1.json
                    - id: tests-shard-2
                      inputs: "-i tests"
                      shard: "2/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-tests-shard-2.json
                    - id: tests-shard-3
                      inputs: "-i tests"
                      shard: "3/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-tests-shard-3.json
                    - id: tests-shard-4
                      inputs: "-i tests"
                      shard: "4/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-tests-shard-4.json
                    - id: tests-shard-5
                      inputs: "-i tests"
                      shard: "5/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-tests-shard-5.json
                    - id: tests-shard-6
                      inputs: "-i tests"
                      shard: "6/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-tests-shard-6.json
                    - id: tests-shard-7
                      inputs: "-i tests"
                      shard: "7/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-tests-shard-7.json
                    - id: tests-shard-8
                      inputs: "-i tests"
                      shard: "8/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-tests-shard-8.json
                    - id: stdlib-shard-1
                      inputs: "-i stdlib"
                      shard: "1/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-stdlib-shard-1.json
                    - id: stdlib-shard-2
                      inputs: "-i stdlib"
                      shard: "2/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-stdlib-shard-2.json
                    - id: stdlib-shard-3
                      inputs: "-i stdlib"
                      shard: "3/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-stdlib-shard-3.json
                    - id: stdlib-shard-4
                      inputs: "-i stdlib"
                      shard: "4/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-stdlib-shard-4.json
                    - id: stdlib-shard-5
                      inputs: "-i stdlib"
                      shard: "5/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-stdlib-shard-5.json
                    - id: stdlib-shard-6
                      inputs: "-i stdlib"
                      shard: "6/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-stdlib-shard-6.json
                    - id: stdlib-shard-7
                      inputs: "-i stdlib"
                      shard: "7/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-stdlib-shard-7.json
                    - id: stdlib-shard-8
                      inputs: "-i stdlib"
                      shard: "8/8"
                      tree_flag: "--no-tree"
                      output: tests-dual-stdlib-shard-8.json

        env:
            LLVM_VERSION: "21.1.0"
            LLVM_DIR: "${{ github.workspace }}/.cache/llvm/21.1.0"
            NEPL_TEST_PROGRESS_FLUSH_EVERY: "1"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Restore Cargo cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: nepl-g2
                  cache-on-failure: true

            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Install Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                  profile: minimal
                  toolchain: stable
                  override: true

            - name: Cache LLVM toolchain
              id: cache-llvm
              uses: actions/cache@v4
              with:
                  path: ${{ env.LLVM_DIR }}
                  key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ env.LLVM_VERSION }}

            - name: Install clang 21.1.0 (linux native)
              if: steps.cache-llvm.outputs.cache-hit != 'true'
              run: |
                  curl -L -o /tmp/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz \
                    https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz
                  mkdir -p "${LLVM_DIR}"
                  tar -C "${LLVM_DIR}" --strip-components=1 -xf /tmp/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz

            - name: Export LLVM environment
              run: |
                  echo "${LLVM_DIR}/bin" >> "${GITHUB_PATH}"
                  echo "NEPL_LLVM_STRICT=1" >> "${GITHUB_ENV}"
                  echo "NEPL_LLVM_CLANG_VERSION=${LLVM_VERSION}" >> "${GITHUB_ENV}"
                  echo "NEPL_LLVM_CLANG_BIN=${LLVM_DIR}/bin/clang" >> "${GITHUB_ENV}"
                  echo "NEPL_LLVM_TRIPLE_CONTAINS=linux" >> "${GITHUB_ENV}"

            - name: Verify LLVM toolchain
              run: |
                  clang --version
                  llvm-as --version
                  llc --version
                  clang -dumpmachine | grep -q linux

            - name: Full dual backend verification (${{ matrix.id }})
              run: node nodesrc/ci_timeout.js --minutes 18 --label "Full dual backend verification (${{ matrix.id }})" --timeout-nonfatal -- node nodesrc/tests.js ${{ matrix.inputs }} -o ${{ matrix.output }} --runner all --llvm-all --assert-io --strict-dual --shard ${{ matrix.shard }} ${{ matrix.tree_flag }} -j 2 --timeout-nonfatal

            - name: Upload full dual backend JSON (${{ matrix.id }})
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: llvm-dual-${{ matrix.id }}
                  path: ${{ matrix.output }}
                  if-no-files-found: ignore

    pages-fast-bundle:
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled()
        timeout-minutes: 10

        steps:
            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Mark site as pending
              run: |
                  mkdir -p dist/tests
                  mkdir -p dist/tests/last-completed
                  pages_url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
                  for file in \
                    status.json \
                    tests-current.json \
                    nmd-tests.json \
                    tutorials-tests.json \
                    examples-tests.json \
                    stdlib-tests.json \
                    tests-llvm.json \
                    selfhost-wasi-tests.json \
                    selfhost-nmd-tests.json \
                    selfhost-tutorials-tests.json \
                    selfhost-examples-tests.json \
                    selfhost-stdlib-tests.json \
                    selfhost-llvm-tests.json \
                    tests-dual-tests.json \
                    tests-dual-stdlib.json
                  do
                    curl -fsSL "${pages_url}/tests/${file}" -o "dist/tests/last-completed/${file}" || true
                  done
                  cat > dist/tests/status.json <<EOF
                  {
                    "state": "pending",
                    "message": "Tests are still running.",
                    "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "head_sha": "${{ github.sha }}",
                    "fallback_status_url": "./tests/last-completed/status.json",
                    "fallback_results_prefix": "./tests/last-completed/",
                    "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  }
                  EOF

            - name: Guard current main SHA before pending Pages artifact
              run: |
                  current_sha="$(git ls-remote "${{ github.server_url }}/${{ github.repository }}.git" refs/heads/main | awk '{print $1}')"
                  if [ "${current_sha}" != "${{ github.sha }}" ]; then
                    echo "Refusing to publish stale Pages artifact for ${{ github.sha }}; current main is ${current_sha}."
                    exit 1
                  fi

            - name: Upload pending Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  name: github-pages-pending
                  path: dist

    pages-fast-deploy:
        runs-on: ubuntu-latest
        needs: pages-fast-bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() && needs.pages-fast-bundle.result == 'success'
        timeout-minutes: 10

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Configure Pages
              uses: actions/configure-pages@v5

            - name: Deploy pending site
              id: deployment
              uses: actions/deploy-pages@v4
              with:
                  artifact_name: github-pages-pending

    pages-final-bundle:
        runs-on: ubuntu-latest
        needs:
            - build
            - compile-test
            - rust-test
            - nm-compile
            - wasi-test
            - nmd-doctest
            - tutorials-test
            - examples-test
            - stdlib-test
            - llvm-test
            - selfhost-doctest
            - llvm-dual-test
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() && needs.build.result == 'success'
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Download bootstrap build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: bootstrap-build
                  path: .

            - name: Download wasi test artifact
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  name: wasi-tests
                  path: artifacts/wasi

            - name: Download nmd test artifact
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  name: nmd-tests
                  path: artifacts/nmd

            - name: Download tutorials test artifact
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  name: tutorials-tests
                  path: artifacts/tutorials

            - name: Download examples test artifact
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  name: examples-tests
                  path: artifacts/examples

            - name: Download stdlib test artifact
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  name: stdlib-tests
                  path: artifacts/stdlib

            - name: Download llvm test artifact
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  name: llvm-tests
                  path: artifacts/llvm

            - name: Download selfhost compiler check artifacts
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  pattern: selfhost-*-tests
                  path: artifacts/selfhost
                  merge-multiple: true

            - name: Download LLVM dual tests artifact
              continue-on-error: true
              uses: actions/download-artifact@v4
              with:
                  pattern: llvm-dual-*
                  path: artifacts/llvm-dual
                  merge-multiple: true

            - name: Merge test artifacts into dist
              run: |
                  mkdir -p dist/tests
                  cp -f artifacts/wasi/tests-current.json dist/tests/tests-current.json || true
                  cp -f artifacts/nmd/nmd-tests.json dist/tests/nmd-tests.json || true
                  cp -f artifacts/tutorials/tutorials-tests.json dist/tests/tutorials-tests.json || true
                  cp -f artifacts/examples/examples-tests.json dist/tests/examples-tests.json || true
                  cp -f artifacts/stdlib/stdlib-tests.json dist/tests/stdlib-tests.json || true
                  cp -f artifacts/llvm/tests-llvm.json dist/tests/tests-llvm.json || true
                  cp -f artifacts/selfhost/selfhost-wasi-tests.json dist/tests/selfhost-wasi-tests.json || true
                  cp -f artifacts/selfhost/selfhost-nmd-tests.json dist/tests/selfhost-nmd-tests.json || true
                  cp -f artifacts/selfhost/selfhost-tutorials-tests.json dist/tests/selfhost-tutorials-tests.json || true
                  cp -f artifacts/selfhost/selfhost-examples-tests.json dist/tests/selfhost-examples-tests.json || true
                  cp -f artifacts/selfhost/selfhost-stdlib-tests.json dist/tests/selfhost-stdlib-tests.json || true
                  cp -f artifacts/selfhost/selfhost-llvm-tests.json dist/tests/selfhost-llvm-tests.json || true
                  cp -f artifacts/llvm-dual/tests-dual-tests.json dist/tests/tests-dual-tests.json || true
                  cp -f artifacts/llvm-dual/tests-dual-stdlib.json dist/tests/tests-dual-stdlib.json || true
                  if ls artifacts/llvm-dual/tests-dual-tests-shard-*.json >/dev/null 2>&1; then
                    node nodesrc/merge_doctest_json.js -o dist/tests/tests-dual-tests.json artifacts/llvm-dual/tests-dual-tests-shard-*.json
                  fi
                  if ls artifacts/llvm-dual/tests-dual-stdlib-shard-*.json >/dev/null 2>&1; then
                    node nodesrc/merge_doctest_json.js -o dist/tests/tests-dual-stdlib.json artifacts/llvm-dual/tests-dual-stdlib-shard-*.json
                  fi

            - name: Write final status summary
              run: |
                  mkdir -p dist/tests
                  cat > dist/tests/status.json <<EOF
                  {
                    "state": "final",
                    "message": "Final CI result artifacts are published.",
                    "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                    "head_sha": "${{ github.sha }}",
                    "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "compile_test": "${{ needs['compile-test'].result }}",
                    "rust_test": "${{ needs['rust-test'].result }}",
                    "nm_compile": "${{ needs['nm-compile'].result }}",
                    "wasi_test": "${{ needs['wasi-test'].result }}",
                    "nmd_doctest": "${{ needs['nmd-doctest'].result }}",
                    "tutorials_test": "${{ needs['tutorials-test'].result }}",
                    "examples_test": "${{ needs['examples-test'].result }}",
                    "stdlib_test": "${{ needs['stdlib-test'].result }}",
                    "llvm_test": "${{ needs['llvm-test'].result }}",
                    "selfhost_doctest": "${{ needs['selfhost-doctest'].result }}",
                    "llvm_dual_test": "${{ needs['llvm-dual-test'].result }}"
                  }
                  EOF

            - name: Guard current main SHA before final Pages artifact
              run: |
                  current_sha="$(git ls-remote "${{ github.server_url }}/${{ github.repository }}.git" refs/heads/main | awk '{print $1}')"
                  if [ "${current_sha}" != "${{ github.sha }}" ]; then
                    echo "Refusing to publish stale Pages artifact for ${{ github.sha }}; current main is ${current_sha}."
                    exit 1
                  fi

            - name: Upload final Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  name: github-pages-final
                  path: dist

    pages-final-deploy:
        runs-on: ubuntu-latest
        needs:
            - pages-fast-deploy
            - pages-final-bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() && needs.pages-fast-deploy.result == 'success' && needs.pages-final-bundle.result == 'success'
        timeout-minutes: 10

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Configure Pages
              uses: actions/configure-pages@v5

            - name: Deploy final site
              id: deployment
              uses: actions/deploy-pages@v4
              with:
                  artifact_name: github-pages-final
